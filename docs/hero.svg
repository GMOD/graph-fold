<path d="M40 206 L78 206 Q85.0 224 92 206 L96 206 Q108.0 224 120 206 L117 206 Q126.0 180 135 206 L136 206 Q145.0 240 154 206 L160 206 Q167.0 218 174 206 L181 206 Q188.0 218 195 206 L205 206 Q217.0 180 229 206 L226 206 Q238.0 218 250 206 L247 206 Q259.0 240 271 206 L268 206 Q280.0 188 292 206 L286 206 Q291.0 194 296 206 L308 206 Q315.0 224 322 206 L329 206 Q336.0 218 343 206 L351 206 Q358.0 194 365 206 L369 206 Q378.0 224 387 206 L388 206 Q400.0 232 412 206 L416 206 Q421.0 218 426 206 L440 206 Q445.0 218 450 206 L461 206 Q468.0 194 475 206 L483 206 Q495.0 240 507 206 L511 206 Q520.0 240 529 206 L535 206 Q542.0 232 549 206 L565 206 Q574.0 194 583 206 L589 206 Q601.0 180 613 206 L611 206 Q618.0 180 625 206 L635 206 Q642.0 240 649 206 L657 206 Q662.0 240 667 206 L677 206 Q689.0 224 701 206 L702 206 Q714.0 218 726 206 L723 206 Q728.0 188 733 206 L810 206 Q815.0 218 820 206 L840 206 Q852.0 188 864 206 L866 206 Q871.0 188 876 206 L886 206 Q895.0 240 904 206 L920 206" fill="none" stroke="#0d9488" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="250" y="285" class="n" text-anchor="middle">hundreds of tiny wiggles…</text>
<text x="540" y="285" class="n" text-anchor="middle">…hide the big changes</text>
<rect x="250.0" y="345" width="460" height="56" rx="28" class="pill"/>
<text x="480.0" y="369" class="pt" text-anchor="middle">graph-fold</text>
<text x="480.0" y="389" class="ps" text-anchor="middle">smooths away every difference smaller than a threshold</text>
<path d="M480.0 323 V341 M472.0 333 L480.0 343 L488.0 333" class="arr"/>
<path d="M480.0 405 V425 M472.0 415 L480.0 425 L488.0 415" class="arr"/>
<text x="40" y="465" class="h">After: only the big changes are left</text>
<text x="40" y="489" class="s">The small differences are folded into the straight lines, so the structural variants stand out.</text>
<text x="40" y="573" class="l">reference genome</text>
<line x1="40" y1="585" x2="920" y2="585" stroke="#222" stroke-width="8" stroke-linecap="round"/>
<path d="M40 609 L430 609 C490 679 590 679 650 609 L920 609" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M40 625 L430 625 C490 683 590 683 650 625 L760 625 C750 550 810 550 800 625 L920 625" fill="none" stroke="#ea580c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M40 641 L920 641" fill="none" stroke="#0d9488" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40" y="775" class="s">A real example: 21 kb of chromosome 16 in 464 people is 1,655 pieces before folding and 3 after.</text>
<text x="540.0" y="725" class="n" text-anchor="middle">deletion: blue and orange skip this stretch</text>
<text x="780.0" y="551" class="n" text-anchor="middle">insertion: orange has extra DNA</text>
</svg>
