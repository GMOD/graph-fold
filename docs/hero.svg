<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>graph-fold: before and after</title>
<rect width="1200" height="470" rx="12" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start" >graph-fold hides the tiny differences between genomes and keeps the big ones</text>
<text x="40.0" y="70.0" font-size="13.5" fill="#59636e" font-weight="400" text-anchor="start" >Each colored line is one person’s DNA, read left to right along the genome. The gray line is the reference genome they are all compared to.</text>
<text x="40.0" y="262.0" font-size="15" fill="#9a6700" font-weight="600" text-anchor="start" >▼ fold</text>
<text x="40.0" y="280.0" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" >by the rule</text>
<text x="40.0" y="295.0" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" >on the right</text>
<text x="40.0" y="150.0" font-size="17" fill="#1f2328" font-weight="600" text-anchor="start" >Before</text>
<text x="40.0" y="169.0" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" >every difference,</text>
<text x="40.0" y="184.0" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" >even one letter,</text>
<text x="40.0" y="199.0" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start" >is a branch</text>
