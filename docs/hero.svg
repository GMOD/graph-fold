<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>
.h { font-size: 20px; font-weight: 700; fill: #111 }
.s { font-size: 15px; fill: #444 }
.l { font-size: 13px; fill: #222 }
.n { font-size: 15px; font-style: italic; fill: #333 }
.pill { fill: #f3f0ff; stroke: #7c3aed; stroke-width: 2 }
.pt { font-size: 18px; font-weight: 700; fill: #5b21b6 }
.ps { font-size: 14px; fill: #4c1d95 }
.arr { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round }
</style>
<rect width="960" height="780" rx="12" fill="#fff"/>
<text x="40" y="30" class="h">Before: a pangenome graph</text>
<text x="40" y="54" class="s">Each coloured line is one person’s genome. Every small difference, even one letter, gets its own wiggle.</text>
<text x="40" y="138" class="l">reference genome</text>
