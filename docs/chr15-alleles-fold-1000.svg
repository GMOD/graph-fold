<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="232" viewBox="0 0 1400 232" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="24" y="22" font-size="15" font-weight="600" fill="#111">chr15:92,768,150-92,768,700, six alleles of 50 to 156 bp: folded at 1000 bp</text><text x="24" y="42" font-size="13" font-weight="400" fill="#111">1 nodes, 2 distinct walks of 464 haplotypes, 1 columns; node width is linear, 3 bp to the px; 0 kept branches</text><g transform="translate(38.775956284153004 52) scale(1.4775956284153005)"><rect x="0" y="24" width="896" height="29" fill="#aab4c0"/><rect x="0" y="20" width="896" height="4" fill="#2b2b2b"/><path d="M 11 20 Q 11 11 20 11 L 875 11 Q 884 11 884 20 L 884 53 Q 884 62 875 62 L 20 62 Q 11 62 11 53 L 11 20" fill="none" stroke="#111" stroke-width="1"/></g><text x="700" y="76.55191256830601" font-size="11" text-anchor="middle" fill="#444">2.6 kb</text><text x="24" y="177.86448087431694" font-size="12" fill="#444">reference dark, bands sized by haplotype share; a band or box takes the colour of its branch:</text><rect x="24" y="185.86448087431694" width="14" height="14" fill="#1f77b4"/><text x="44" y="197.86448087431694" font-size="12" fill="#222">insertion</text><rect x="134" y="185.86448087431694" width="14" height="14" fill="#d62728"/><text x="154" y="197.86448087431694" font-size="12" fill="#222">deletion</text><rect x="244" y="185.86448087431694" width="14" height="14" fill="#8e44ad"/><text x="264" y="197.86448087431694" font-size="12" fill="#222">inversion</text><rect x="354" y="185.86448087431694" width="14" height="14" fill="#e67e22"/><text x="374" y="197.86448087431694" font-size="12" fill="#222">other</text></svg>